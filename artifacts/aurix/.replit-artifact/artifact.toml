kind = "web"
previewPath = "/"
title = "AURIX — The Digital Foundation"
version = "1.0.0"
id = "artifacts/aurix"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21520

[services.development]
run = "pnpm --filter @workspace/aurix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aurix", "run", "build" ]
publicDir = "artifacts/aurix/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21520"
BASE_PATH = "/"
