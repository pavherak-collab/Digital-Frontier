[build]
  command   = "pnpm --filter @workspace/aurix run build"
  publish   = "artifacts/aurix/dist/public"

[build.environment]
  NODE_VERSION = "24"
  BASE_PATH    = "/"

[functions]
  directory         = "netlify/functions"
  node_bundler      = "esbuild"
  included_files    = []

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
